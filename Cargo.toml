[package]
name = "corvus"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.3", features = ["chat-completion"] }
async-trait = "0.1.92"
dotenvy = "0.15.7"
microsandbox = "0.6.17"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
